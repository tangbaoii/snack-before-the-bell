<!doctype html>
<html lang="en">
<head>

<title>Chew &amp; Hide</title>
<style>
  :root { --ink:#1d2330; --paper:#fffaf0; --accent:#ff7a3d; --ok:#3fbf6a; --bad:#e5484d; --gold:#ffc83d; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#1b1f27; font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif; color:var(--ink); user-select:none; }

  .key { display:inline-flex; align-items:center; justify-content:center; font-family:ui-monospace,Menlo,monospace; font-weight:800; border-radius:5px; }

  #hud { position:fixed; top:10px; left:50%; transform:translateX(-50%); display:none; gap:10px; align-items:stretch; pointer-events:none; }

  #labels { position:fixed; inset:0; pointer-events:none; }

  #seqPanel .key.cur { background:#fff; color:var(--ink); transform:translateY(-3px); box-shadow:0 3px 0 var(--gold); }
  #seqPanel.shake { animation:shake .3s; }
  @keyframes shake { 20%{transform:translateX(calc(-50% - 8px))} 40%{transform:translateX(calc(-50% + 8px))} 60%{transform:translateX(calc(-50% - 5px))} 80%{transform:translateX(calc(-50% + 5px))} }

  #lock { position:fixed; inset:0; display:none; pointer-events:none; background:radial-gradient(circle, rgba(140,190,60,.0) 30%, rgba(120,170,40,.45)); }
  #lock .n { font-size:150px; font-weight:900; color:#fff; text-shadow:0 6px 0 rgba(0,0,0,.35); line-height:1; }
  #lock .m { font-size:20px; color:#fff; font-weight:700; text-shadow:0 2px 4px rgba(0,0,0,.6); margin-top:8px; }

  @keyframes pop { from{transform:scale(1.6);opacity:.3} to{transform:scale(1);opacity:1} }

  #seqPanel .spit { width:240px; height:8px; background:rgba(255,255,255,.2); border-radius:4px; overflow:hidden; margin:6px auto 2px; }

  #teacherBox { min-width:190px; text-align:center; font-size:13px; transition:background .15s; }

  #teacherBox.warn { background:#ffd84d !important; animation:blink .25s infinite alternate; }
  #teacherBox.look { background:var(--bad) !important; color:#fff; }
  @keyframes blink { to { transform:scale(1.06); } }
  #alert { position:fixed; left:0; right:0; top:92px; display:none; text-align:center; pointer-events:none; }
  #alert div { display:inline-block; background:var(--bad); color:#fff; font-size:34px; font-weight:900; padding:6px 28px; border-radius:16px; box-shadow:0 6px 0 rgba(0,0,0,.35); animation:alertPulse .4s infinite alternate; letter-spacing:1px; }
  #alert.warn div { background:#ffd84d; color:var(--ink); font-size:26px; animation:none; }
  #alert small { display:block; font-size:16px; font-weight:700; opacity:.9; }
  @keyframes alertPulse { from { transform:scale(1); } to { transform:scale(1.08); } }
  #vignette.look { animation:vig .35s infinite alternate; }
  @keyframes vig { from { box-shadow:inset 0 0 120px 30px rgba(229,72,77,.6); } to { box-shadow:inset 0 0 200px 70px rgba(229,72,77,.85); } }
  #vignette { position:fixed; inset:0; pointer-events:none; box-shadow:inset 0 0 130px 30px rgba(229,72,77,.65); opacity:0; transition:opacity .12s; }
  #flash { position:fixed; inset:0; pointer-events:none; background:#fff; opacity:0; }

  #toast { position:fixed; top:190px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:8px 16px; border-radius:20px; font-weight:700; opacity:0; transition:opacity .2s; pointer-events:none; white-space:nowrap; }
  #toast.show { opacity:1; }
  .float { position:fixed; font-weight:900; font-size:26px; color:var(--gold); text-shadow:0 2px 0 #000, 0 0 6px rgba(0,0,0,.5); pointer-events:none; animation:floatUp 1s forwards; transform:translate(-50%,-50%); }
  .float.bad { color:#c6f06a; }
  @keyframes floatUp { to { margin-top:-70px; opacity:0; } }

  #bubble { position:fixed; display:none; background:#fff; padding:10px 16px; border-radius:16px; font-weight:800; font-size:20px; box-shadow:0 4px 0 rgba(0,0,0,.3); transform:translate(-50%,-100%); }

  #panel { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(15,18,25,.55); padding:16px; }
  #panel.hidden { display:none; }
  .card { background:var(--paper); border-radius:20px; padding:24px 28px; width:min(560px,100%); max-height:94vh; overflow:auto; box-shadow:0 10px 0 rgba(0,0,0,.25); text-align:center; }
  .card h1 { margin:0 0 4px; font-size:40px; letter-spacing:2px; }
  .card h2 { margin:0 0 8px; font-size:30px; }
  .card .sub { color:#666; margin-bottom:14px; }
  .card .rules { text-align:left; font-size:14px; line-height:1.7; background:#f3ecdc; border-radius:12px; padding:10px 14px; margin:10px 0 14px; }
  .card .rules .key { background:var(--ink); color:#fff; padding:0 5px; font-size:12px; }
  .levels { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin:10px 0 6px; }
  .levels button { padding:10px 0; font-size:13px; }
  .levels button .st { display:block; font-size:12px; color:var(--gold); letter-spacing:1px; min-height:14px; }
  button { font:inherit; font-weight:800; border:0; border-radius:12px; padding:11px 22px; background:var(--accent); color:#fff; cursor:pointer; box-shadow:0 4px 0 #b4501f; margin:4px; }
  button:active { transform:translateY(3px); box-shadow:0 1px 0 #b4501f; }
  button.ghost { background:#ddd3bf; color:var(--ink); box-shadow:0 4px 0 #a99d86; }

  .stars b { color:var(--gold); font-weight:400; }
  table.res { margin:8px auto 14px; border-collapse:collapse; font-size:16px; }
  table.res td { padding:4px 14px; } table.res td:first-child { color:#777; text-align:right; } table.res td:last-child { font-weight:800; text-align:left; }
  .hint { font-size:12px; color:#888; margin-top:8px; }

  #touch { position:fixed; bottom:90px; right:14px; display:none; grid-template-columns:repeat(3,56px); gap:6px; }
  #touch button { padding:0; height:56px; margin:0; font-size:20px; background:rgba(255,250,240,.85); color:var(--ink); box-shadow:0 3px 0 rgba(0,0,0,.3); }
  @media (max-width:640px) {
    #alert div { font-size:28px; } #teacherBox { min-width:110px; }
    #hud { top:6px; gap:5px; } #hud > div { padding:4px 8px; } #hudTime { font-size:22px; min-width:70px; } #hudScore { min-width:120px; } #hudLevel { display:none; }
    #seqPanel .key { width:24px; height:28px; font-size:15px; }
    .levels { grid-template-columns:repeat(3,1fr); }
  }
</style>

<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';

/* ============================================================
   配置：关卡与食物（仿 sneakyschool 的 JSON 关卡数据，改数值即可调难度）
   ============================================================ */
const LEVELS = [
  { subj:'Math',       board:'Chapter 3   Quadratic Equations   ax² + bx + c = 0', time:90, turnEvery:[5,9],   watch:[1.6,2.8], warn:1.1, turnTime:1.0,  fake:0,   items:['bun','jelly','onigiri','sandwich','yakisoba'] },
  { subj:'Literature', board:'"Spring Morning"   —   memorize it by Friday!',        time:90, turnEvery:[4.5,8], watch:[1.6,3.0], warn:1.0, turnTime:0.85, fake:.2,  items:['bun','jelly','onigiri','sandwich','yakisoba','chicken'] },
  { subj:'English',    board:'Unit 5   What did you eat for breakfast?',              time:90, turnEvery:[4,7.5], watch:[1.7,3.0], warn:0.9, turnTime:0.7,   fake:.25, items:['jelly','onigiri','sandwich','yakisoba','chicken','tea','bun'] },
  { subj:'Physics',    board:"Newton's Second Law   F = m a",                         time:85, turnEvery:[3.5,7], watch:[1.8,3.2], warn:0.8, turnTime:0.55, fake:.3,  items:['bun','jelly','onigiri','onigiri','sandwich','yakisoba','chicken','tea'] },
  { subj:'History',    board:'FINAL EXAM REVIEW   ※ Everything is important ※',      time:85, turnEvery:[3,6],   watch:[2.0,3.4], warn:0.7, turnTime:0.45,  fake:.35, items:['bun','jelly','jelly','onigiri','sandwich','yakisoba','chicken','tea','tea'] },
];
const FOODS = {
  bun:      { name:'Bun',            pts:10,  len:4,  color:'#d89a4e' },
  jelly:    { name:'Energy Jelly',   pts:15,  len:5,  color:'#e8eef7' },
  onigiri:  { name:'Onigiri',        pts:20,  len:6,  color:'#f4f4ee' },
  sandwich: { name:'Sandwich',       pts:40,  len:8,  color:'#f0d9a0' },
  yakisoba: { name:'Noodle Hot Dog', pts:55,  len:9,  color:'#8a5a2b' },
  chicken:  { name:'Fried Chicken',  pts:70,  len:10, color:'#d08a2c' },
  tea:      { name:'Bubble Tea',     pts:100, len:12, color:'#c89b6d' },
};
const SPIT_LOCK = 3;
const SLOT_X = [-0.48, -0.24, 0, 0.24, 0.48], SLOT_Z = 2.88, DESK_Y = 0.75;
const CAM_POS = new THREE.Vector3(0, 1.2, 3.65), CAM_LOOK = new THREE.Vector3(0, 0.95, 2.85 - 0.6);
const PLAYER_Z = 2.95;

/* ============================================================ utils */
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const pickW = obj => { const ks = Object.keys(obj); let t = ks.reduce((s, k) => s + obj[k].weight, 0) * Math.random(); for (const k of ks) { t -= obj[k].weight; if (t <= 0) return k; } return ks[0]; };
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const store = {
  get() { try { return JSON.parse(localStorage.getItem('snack-bell-v3') || '') || null; } catch { return null; } },
  set(v) { try { localStorage.setItem('snack-bell-v3', JSON.stringify(v)); } catch {} },
};
let save = store.get() || { unlocked: 1, stars: [0, 0, 0, 0, 0] };

/* ============================================================ audio (WebAudio 合成，无外部文件) */
let ac, master, noiseBuf;
function ensureAudio() {
  if (!ac) {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = 0.55; master.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (ac.state === 'suspended') ac.resume();
}
function tone(f, d, o = {}) {
  if (!ac) return; const t = ac.currentTime + (o.at || 0);
  const osc = ac.createOscillator(); osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t);
  if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30, f + o.slide), t + d);
  const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(o.gain || 0.2, t + (o.attack || 0.006)); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  osc.connect(g).connect(master); osc.start(t); osc.stop(t + d + 0.05);
}
function noise(d, o = {}) {
  if (!ac) return; const t = ac.currentTime + (o.at || 0);
  const src = ac.createBufferSource(); src.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = o.type || 'bandpass'; f.frequency.setValueAtTime(o.freq || 1000, t); f.Q.value = o.q || 1;
  if (o.slide) f.frequency.exponentialRampToValueAtTime(Math.max(40, (o.freq || 1000) + o.slide), t + d);
  const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(o.gain || 0.3, t + (o.attack || 0.004)); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  src.connect(f).connect(g).connect(master); src.start(t, Math.random() * 1.5); src.stop(t + d + 0.05);
}
const sfx = {
  chalk() { noise(rand(.04, .09), { freq: rand(3500, 5500), q: 5, gain: 0.07 }); },
  step(at = 0) { tone(85, .14, { gain: .4, slide: -35, at }); noise(.06, { freq: 260, q: 1, gain: .25, at }); },
  bite() { noise(.06, { freq: rand(1800, 3200), q: 2, gain: .45 }); noise(.08, { freq: 700, q: 1.5, gain: .3, at: .03 }); },
  done() { tone(660, .09, { type: 'triangle', gain: .25 }); tone(990, .16, { type: 'triangle', gain: .25, at: .08 }); tone(1320, .2, { type: 'triangle', gain: .18, at: .16 }); },
  spit() { noise(.4, { freq: 1400, slide: -1100, q: 1.2, gain: .55 }); tone(320, .35, { type: 'sawtooth', gain: .12, slide: -220 }); },
  tick() { tone(1100, .06, { type: 'square', gain: .08 }); },
  select() { tone(520, .05, { type: 'triangle', gain: .12 }); },
  deny() { tone(180, .12, { type: 'square', gain: .1 }); },
  caught() { [220, 277, 330].forEach((f, i) => tone(f, 1.1, { type: 'sawtooth', gain: .12, slide: -90, at: i * .02 })); noise(.25, { freq: 3000, q: 8, gain: .3 }); tone(1800, .5, { gain: .12, at: .05, slide: 400 }); },
  bell() { const n = [329.6, 261.6, 293.7, 196, 196, 293.7, 329.6, 261.6]; n.forEach((f, i) => { tone(f, 1.3, { gain: .22, at: i * .42, attack: .01 }); tone(f * 2.76, .6, { gain: .05, at: i * .42 }); }); },
  win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .3, { type: 'triangle', gain: .2, at: i * .1 })); },
  lose() { [392, 330, 262].forEach((f, i) => tone(f, .4, { type: 'triangle', gain: .2, at: i * .2 })); },
  turn() { noise(.3, { freq: 400, slide: 2500, q: .8, gain: .35 }); tone(392, .18, { type: 'square', gain: .16, at: .05 }); tone(311, .35, { type: 'square', gain: .16, at: .22 }); },
  warnBeep() { tone(880, .09, { type: 'square', gain: .1 }); tone(880, .09, { type: 'square', gain: .1, at: .16 }); },
  ahem() { tone(150, .14, { type: 'sawtooth', gain: .12, slide: 30 }); noise(.12, { freq: 500, q: 1, gain: .22, at: .18 }); },
  gasp() { noise(.5, { freq: 900, q: .7, gain: .25, slide: 500 }); },
};

/* ============================================================ three 基础 */
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
const scene = new THREE.Scene();
scene.background = new THREE.Color('#e9e4d6');
scene.fog = new THREE.Fog('#e9e4d6', 14, 26);
const camera = new THREE.PerspectiveCamera(55, 1, 0.05, 60);
scene.add(new THREE.HemisphereLight('#ffffff', '#8a7358', 1.9));
const sun = new THREE.DirectionalLight('#fff3dc', 1.6); sun.position.set(-8, 7, 2); scene.add(sun);
const fill = new THREE.DirectionalLight('#dfe8ff', 0.5); fill.position.set(5, 4, 6); scene.add(fill);

const matCache = new Map(), geoCache = new Map();
function mat(color, opts) {
  const key = color + (opts ? JSON.stringify(opts) : '');
  if (!matCache.has(key)) matCache.set(key, new THREE.MeshLambertMaterial({ color, flatShading: true, ...opts }));
  return matCache.get(key);
}
function boxGeo(w, h, d) { const k = `${w}|${h}|${d}`; if (!geoCache.has(k)) geoCache.set(k, new THREE.BoxGeometry(w, h, d)); return geoCache.get(k); }
function box(w, h, d, color, parent, x = 0, y = 0, z = 0) { const m = new THREE.Mesh(boxGeo(w, h, d), mat(color)); m.position.set(x, y, z); parent.add(m); return m; }
function mesh(geo, color, parent, x = 0, y = 0, z = 0) { const m = new THREE.Mesh(geo, typeof color === 'string' ? mat(color) : color); m.position.set(x, y, z); parent && parent.add(m); return m; }
function emojiSprite(ch, size = .3) {
  const cv = document.createElement('canvas'); cv.width = cv.height = 128; const c = cv.getContext('2d');
  c.font = '100px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(ch, 64, 72);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), depthTest: false })); s.scale.setScalar(size); s.renderOrder = 10; return s;
}

/* ============================================================ 教室 */
const room = new THREE.Group(); scene.add(room);
const RX = 6, RZF = -8, RZB = 6, RH = 3.4;
box(RX * 2, .1, RZB - RZF, '#c9a274', room, 0, -.05, (RZF + RZB) / 2);          // 地板
box(RX * 2, .1, RZB - RZF, '#f2efe6', room, 0, RH, (RZF + RZB) / 2);            // 天花板

function updateParticles(dt) {

    const p = particles[i]; p.life -= dt; p.v.y -= 4.5 * dt; p.m.position.addScaledVector(p.v, dt); p.m.rotation.x += dt * 8;

  const em = ['🤩', '😱', '👏', '😮', '🙇', '🤯', '😍'];
  students.forEach(s => { s.head.remove(s.emo); const sp = emojiSprite(pick(em), .35); sp.position.set(0, .45, 0); s.head.add(sp); s.emo = sp; });

}

/* ============================================================ 主循环 */
let lastT = performance.now(), elapsed = 0;
const tmpV = new THREE.Vector3();
function update(dt) {

  }
  if (G && st === 'playing') {
    G.timeLeft -= dt;
    if (G.lockT > 0) { G.lockT -= dt; if (G.lockT <= 0) { G.lockT = 0; $('#lock').style.display = 'none'; } }
    if (G.timeLeft <= 0) { G.timeLeft = 0; bell(); }
  }
  updateTeacher(dt);
  updateStudents(dt, elapsed);
  updateFoods(dt);
  updateHands(dt);
  updateParticles(dt);
  updateCamera(dt);
  updateClock();
  updateHUD();

function updateTeacher(dt) {
  const tg = teacher; const playing = G && G.state === 'playing';
  const writing = T.state === 'board';

  } else if (T.state === 'turning') {
    T.t -= dt; if (T.t <= 0) { T.state = 'watching'; T.t = rand(...G.lv.watch); }
  } else if (T.state === 'watching') {

  } else if (T.state === 'back') {
    T.t -= dt; if (T.t <= 0) { T.state = 'board'; T.t = rand(...G.lv.turnEvery); T.hinted = false; T.nearCounted = false; T.hintAt = rand(.6, 1.4); }

  const goal = facing ? 0 : T.state === 'warning' ? Math.PI - .6 : Math.PI;
  const k = T.state === 'turning' ? 22 : T.state === 'back' ? 12 : T.state === 'warning' ? 9 : 6;
  if (T.state === 'turning') { T.turnP = 1 - Math.max(0, T.t) / T.turnDur; T.rot = lerp(T.turnFrom, 0, ease(T.turnP)); }

  tg.g.rotation.y = T.rot;
  tg.g.scale.setScalar(damp(tg.g.scale.x, (facing && T.state !== 'ending' ? 1.15 : 1) * TS, 8, dt));
  tg.g.position.z = damp(tg.g.position.z, RZF + (facing ? 1.25 : .8), 6, dt);

    T.chalkT -= dt; if (T.chalkT <= 0) { T.chalkT = rand(.08, .22); if (G.state === 'playing' || G.state === 'intro') { sfx.chalk(); chalkStroke(); } }

  } else if (T.state === 'warning') {

  } else if (T.state === 'fakeout') {

  } else if (T.state === 'caught') {

    armL.rotation.z = damp(armL.rotation.z, -.3, 8, dt);
    tg.head.rotation.y = T.state === 'watching' ? Math.sin(elapsed * 2.2) * .35 : damp(tg.head.rotation.y, 0, 6, dt);
  } else { armR.rotation.x = damp(armR.rotation.x, 0, 6, dt); }
  if (!facing) armL.rotation.z = damp(armL.rotation.z, 0, 6, dt);
  const looking = G && (teacherWatching() || T.state === 'caught'), warnOn = G && G.state === 'playing' && (T.state === 'warning' || (T.state === 'turning' && !teacherWatching()));
  const vg = $('#vignette'); vg.style.opacity = looking ? 1 : 0; vg.classList.toggle('look', !!looking && T.state !== 'caught');
  tg.qmark.visible = !!warnOn; tg.look.visible = !!(G && G.state === 'playing' && teacherWatching());
  if (tg.qmark.visible) tg.qmark.scale.setScalar(.4 + Math.sin(elapsed * 25) * .06);
  if (tg.look.visible) tg.look.scale.setScalar(.5 + Math.sin(elapsed * 14) * .08);

  if (T.uiMode !== mode) {
    T.uiMode = mode; const box = $('#teacherBox'), al = $('#alert');
    box.className = mode; $('#tStat').textContent = mode === 'look' ? '👀 LOOKING!' : mode === 'warn' ? '⚠️ Turning…' : '✍️ Writing';
    al.className = mode; al.style.display = mode ? 'block' : 'none';
    al.firstElementChild.innerHTML = mode === 'look' ? '👀 FREEZE!<small>The teacher is watching the class</small>' : mode === 'warn' ? '⚠️ The teacher is about to turn!' : '';
  }
}
function updateFoods(dt) {
  if (!G) return;
  G.slots.forEach((s, i) => {
    if (!s) return;
    if (s.state === 'ready') { s.pop = Math.min(1, s.pop + dt * 4); const k = s.pop < 1 ? 1 + Math.sin(s.pop * Math.PI) * .25 : 1; s.root.scale.setScalar(Math.max(.01, ease(s.pop) * k)); }
    else if (s.state === 'gone') { s.pop = Math.min(1, s.pop + dt * 5); s.root.scale.setScalar(Math.max(.01, 1 - s.pop)); if (s.pop >= 1) { room.remove(s.root); s.state = 'empty'; s.dirty = true; } }
  });
  if (G.state === 'playing') G.respawn.forEach((r, i) => {
    if (r > 0) { G.respawn[i] -= dt; if (G.respawn[i] <= 0 && G.bag.length) { if (G.slots[i] && G.slots[i].root) room.remove(G.slots[i].root); placeFood(i, G.bag.pop()); } }
  });
  const sel = G.slots[G.sel];
  ring.visible = G.state === 'playing' || G.state === 'intro';
  ring.position.x = damp(ring.position.x, SLOT_X[G.sel], 18, dt);
  beam.visible = ring.visible; beam.position.x = ring.position.x; beam.material.opacity = .12 + Math.sin(elapsed * 6) * .06;
  G.slots.forEach((x, i) => { if (x && x.state === 'ready' && x.pop >= 1) x.root.position.y = DESK_Y + (i === G.sel ? .012 + Math.abs(Math.sin(elapsed * 5)) * .02 : 0); });
  ring.material.color.set(sel && sel.prog > 0 ? '#ff7a3d' : '#ffc83d'); ring.material.opacity = .6 + Math.sin(elapsed * 6) * .3;
}
function updateHands(dt) {
  handAnim.t = Math.min(1, handAnim.t + dt / .26);
  const r = hands.R, l = hands.L, rest = HAND_REST.R;
  if (handAnim.t < 1) {
    const t = handAnim.t;
    if (t < .4) tmpV.lerpVectors(rest, handAnim.food, ease(t / .4)); else tmpV.lerpVectors(handAnim.food, MOUTH, ease((t - .4) / .6));
    r.position.lerp(tmpV, .6); r.rotation.x = -t * .6;
  } else { r.position.lerp(rest, 1 - Math.exp(-10 * dt)); r.rotation.x = damp(r.rotation.x, 0, 10, dt); }
  l.position.copy(HAND_REST.L); l.position.y += Math.sin(elapsed * 2) * .003;
  const hide = !G || G.state === 'ending'; r.visible = l.visible = !hide;
}
const camLook = CAM_LOOK.clone();
function updateCamera(dt) {
  const pos = tmpV.copy(CAM_POS);
  let look = CAM_LOOK;
  if (camState.mode === 'caught') {
    camState.t = Math.min(1, camState.t + dt * 1.6);
    const head = new THREE.Vector3(); teacher.head.getWorldPosition(head); head.y += .42;
    const close = head.clone().add(new THREE.Vector3(0, -.1, 2.7));
    pos.lerpVectors(CAM_POS, close, ease(camState.t)); look = head;
    camLook.lerp(look, 1 - Math.exp(-6 * dt));
    if (camState.t > .5) { const s = toScreen(head.clone().add(new THREE.Vector3(0, .62, 0))); const b = $('#bubble'); b.style.left = s.x + 'px'; b.style.top = s.y + 'px'; }
  } else if (camState.mode === 'menu') {
    pos.set(Math.sin(elapsed * .15) * 1.5, 2.2, 4.5); camLook.lerp(new THREE.Vector3(0, 1.2, -3), .05); look = null;
  } else if (G && G.state === 'ending') {
    G.endT += dt; pos.set(0, 1.25 + Math.min(G.endT, 1) * .5, CAM_POS.z + Math.min(G.endT, 1) * .6); camLook.lerp(new THREE.Vector3(0, 1.1, -2), .05); look = null;
  } else camLook.lerp(look, 1 - Math.exp(-8 * dt));
  camState.bob = Math.max(0, camState.bob - dt * 6); camState.shake = Math.max(0, camState.shake - dt);
  pos.y -= Math.sin(camState.bob * Math.PI) * .012;
  if (camState.shake > 0) pos.add(new THREE.Vector3(rand(-1, 1), rand(-1, 1), 0).multiplyScalar(camState.shake * .03));
  camera.position.lerp(pos, camState.mode === 'menu' ? .05 : 1); camera.lookAt(camLook);
}
function updateClock() {
  const frac = G ? G.timeLeft / G.lv.time : .5; // 1 → 9:15，0 → 10:00
  const minutes = 60 - frac * 45; hMin.rotation.z = -minutes / 60 * Math.PI * 2;
  hHour.rotation.z = -((9 + minutes / 60) / 12) * Math.PI * 2; hSec.rotation.z = -Math.floor(elapsed) / 60 * Math.PI * 2;
}
function updateHUD() {
  if (!G) { labelEls.forEach(l => l.style.display = 'none'); return; }
  const live = G.state === 'playing' || G.state === 'intro';
  $('#hudTime').textContent = fmt(G.timeLeft); $('#hudTime').classList.toggle('hurry', G.timeLeft <= 10);
  $('#hScore').textContent = G.eaten; $('#hBag').textContent = G.bag.length; $('#hPts').textContent = G.score; $('#hWrong').textContent = G.wrong; $('#hNear').textContent = G.near;
  const bar = $('#bar i'); bar.style.width = (G.eaten / G.total * 100) + '%'; bar.classList.toggle('full', G.eaten === G.total);
  G.slots.forEach((s, i) => {
    const el = labelEls[i]; el.style.display = live ? 'block' : 'none'; if (!live) return;
    const p = toScreen(new THREE.Vector3(SLOT_X[i], DESK_Y + .27, SLOT_Z));
    el.style.transform = `translate(${p.x}px, ${p.y - (i === G.sel ? 26 : 0)}px) translate(-50%,-100%) scale(${i === G.sel ? 1.18 : 1})`;
    const empty = !s || s.state !== 'ready';
    const cls = 'flabel' + (i === G.sel ? ' sel' : '') + (s && s.prog > 0 ? ' locked' : '') + (empty ? ' empty' : '');
    if (el.className !== cls) el.className = cls;
    if (s && s.dirty) { el.innerHTML = `<div class="h">${s.prog > 0 ? '🔒' : ''}${s.def.name}<span>+${s.def.pts}</span></div><div class="s">${keysHTML(s.seq, s.prog)}</div>`; s.dirty = false; G.panelDirty = true; }
  });
  const cur = G.slots[G.sel];
  const key = G.lockT > 0 ? 'spit' : cur ? `${G.sel}|${cur.type}|${cur.prog}|${cur.state}` : 'none';
  if (seqPanel.dataset.k !== key) {
    seqPanel.dataset.k = key;
    seqPanel.innerHTML = G.lockT > 0 ? `<div class="t">🤢 Spitting it out… hold on</div><div class="spit"><i></i></div>` : cur && cur.state === 'ready'
      ? `<div class="t"><b>${cur.def.name} +${cur.def.pts}</b>　${cur.prog > 0 ? `Locked ${cur.prog}/${cur.seq.length}` : '← → / Q E to switch · first correct key locks it'}</div><div class="row">${keysHTML(cur.seq, cur.prog)}</div>`
      : `<div class="t">${G.bag.length ? 'Grabbing the next snack from your bag…' : 'Pick a snack with ← / →'}</div>`;
  }
  if (G.lockT > 0) { const b = seqPanel.querySelector('.spit i'); if (b) b.style.width = (G.lockT / SPIT_LOCK * 100) + '%'; }
}
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.fov = camera.aspect < 1 ? 78 : camera.aspect < 1.4 ? 62 : 55; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
function frame(now) {
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now;
  if (!paused) update(dt);
  renderer.render(scene, camera); requestAnimationFrame(frame);
}
resetBoard(LEVELS[0]); spawnStudents(); showMenu();
requestAnimationFrame(frame);
window.__game = { get G() { return G; }, T, startLevel, onAction };
